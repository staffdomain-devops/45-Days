name: AI Email Campaign Generation

on:
  workflow_dispatch:
    inputs:
      contact_id:
        description: 'HubSpot contact numeric ID'
        required: true
        type: string
      contact_email:
        description: 'Contact email address'
        required: true
        type: string

jobs:
  generate_campaign:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 45_DAYS
    env:
      HUBSPOT_API_KEY: ${{ secrets.HUBSPOT_API_KEY }}
      CHORUS_API_TOKEN: ${{ secrets.CHORUS_API_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
      INPUT_CONTACT_ID: ${{ inputs.contact_id }}
      INPUT_CONTACT_EMAIL: ${{ inputs.contact_email }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch HubSpot contact data
        run: python scripts/fetch_hubspot.py

      - name: Fetch Chorus transcripts
        run: python scripts/fetch_chorus.py

      - name: Compute campaign tokens
        run: python scripts/compute_campaign_tokens.py

      - name: Generate campaign with Claude
        run: python scripts/generate_campaign.py

      - name: Write campaign to HubSpot
        run: python scripts/write_hubspot.py

      - name: Upload campaign output artifact
        uses: actions/upload-artifact@v4
        with:
          name: campaign-output
          path: ${{ runner.temp }}/campaign_output.json
          retention-days: 7
          if-no-files-found: error
